[package]
name = "tef"
version = "1.0.0"
description = "SSHark — SSH, serial, and local terminal"
authors = ["The Engineers Foundry"]
edition = "2021"

[lib]
name = "tef_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
serialport = { version = "4", default-features = false }
portable-pty = "0.8"
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.3"
async-trait = "0.1"
parking_lot = "0.12"
thiserror = "2"
dirs = "6"
anyhow = "1"
arboard = "3"
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Smaller Windows binary (SSH crypto still dominates size)
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
